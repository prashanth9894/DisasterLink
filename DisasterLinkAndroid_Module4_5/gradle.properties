# Stable Android Studio / Gradle configuration
# Keep the Gradle daemon small enough for Windows development machines.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# IMPORTANT: avoid the separate Kotlin compile daemon.
# This fixes the common "Kotlin compile daemon ... terminated unexpectedly"
# startup error on Windows / JDK combinations.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m
kotlin.incremental=false

# Extra compatibility: never require a separate Kotlin compiler daemon.
kotlin.daemon.useFallbackStrategy=true
